{% extends 'tracker/base.html' %}

{% block title %}Delete Mood{% endblock %}

{% block content %}
<main role="main">
  <h2>Delete Mood Entry</h2>

  <p>Are you sure you want to delete this entry?</p>

  <div class="card mb-3">
    <div class="card-body">
      <p><strong>Date:</strong> {{ mood.date }}</p>
      <p><strong>Score:</strong> {{ mood.mood_score }}/10</p>
      <p><strong>Notes:</strong> {{ mood.notes|default:"-" }}</p>
    </div>
  </div>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'mood_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</main>
{% endblock %}
