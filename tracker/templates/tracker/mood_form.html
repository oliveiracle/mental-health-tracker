{% extends 'tracker/base.html' %}

{% block title %}Add Mood{% endblock %}

{% block content %}
<h2>Add Mood Entry</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'mood_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
